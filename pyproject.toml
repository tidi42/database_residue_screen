[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "database-residue-screen"
version = "1.0.2"
description = "Reproducible screening of deposited nucleotide records against a declared reference panel"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
	"biopython>=1.83,<2",
	"jsonschema>=4.10,<5",
	"ushuffle @ https://github.com/guma44/ushuffle/archive/b54df34f60246ff236ec58bbccb40af3cea608ed.tar.gz",
]

[project.urls]
Repository = "https://github.com/tidi42/database_residue_screen"

[project.optional-dependencies]
test = ["pytest>=7.4,<9", "build>=1,<2", "pyahocorasick>=2.1,<3"]
scan = ["pyahocorasick>=2.1,<3"]

[project.scripts]
residue-screen = "database_residue_screen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
database_residue_screen = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
