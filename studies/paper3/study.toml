# Paper 3: library-preparation reference screen of NCBI core_nt (release 2026-09-12).
#
#   residue-screen run-study studies/paper3/study.toml --output <run directory>
#
# Paths below are relative to this file. Machine-specific locations come from environment variables:
#   CORE_NT_DB                 BLAST database prefix of core_nt (e.g. /data/core_nt_20260912/core_nt)
#   CORE_NT_TAXDB              directory with taxdb.bti and taxdb.btd of the same download
#   CORE_NT_DOWNLOAD_EVIDENCE  directory with the download checksums and core_nt-nucl-metadata.json
#   BLAST_BIN                  bin directory of NCBI BLAST+ 2.17.0
#   BLAST_SOURCE_TARBALL       ncbi-blast-2.17.0+-src.tar.gz (length-adjustment routine of the benchmark)
#   TAXDUMP_DIR                NCBI taxdump directory (nodes.dmp, names.dmp, merged.dmp, delnodes.dmp)
#   PANEL_SOURCES              directory for the pinned panel sources (missing files are downloaded into it)
#   NCBI_EMAIL                 contact address sent with NCBI E-utilities requests
# An NCBI API key is optional: add `api_key = "${NCBI_API_KEY}"` to [ncbi]; it is recorded as <redacted>.

[study]
id = "paper3-core-nt-20260912"
title = "Library-preparation sequences in NCBI core_nt"
pipeline = "screen"

[tools]
blastn = "${BLAST_BIN}/blastn"
blastdbcmd = "${BLAST_BIN}/blastdbcmd"
blastdbcheck = "${BLAST_BIN}/blastdbcheck"
makeblastdb = "${BLAST_BIN}/makeblastdb"
blast_formatter = "${BLAST_BIN}/blast_formatter"
cc = "cc"
pdftotext = { command = "pdftotext", version_args = ["-v"] }
Rscript = "Rscript"

[sources]
manifest = "sources.json"
directory = "${PANEL_SOURCES}"
fetch = true
allow_source_drift = true

[panel]
definition = "panel_definition.tsv"
benchmark_templates = [
  { name = "polyA_primer_like", query = "C2_primer_forward", repeat_from = 19 },
]
census_elements = [
  { name = "K46_FRONT", query = "K46_NB01", segment = "front", same_in_family = true },
  { name = "K40_FRONT", query = "K40_NB01", segment = "front", same_in_family = true },
  { name = "NATIVE_REAR", query = "K40_NB01", segment = "rear", same_in_family = true },
  { name = "RAPID_FRONT", query = "RAPID90_RB01", segment = "front", same_in_family = true },
  { name = "RAPID_REAR_START", query = "RAPID90_RB01", segment = "rear", start = 1, end = 16, same_in_family = true },
  { name = "NEXTERA_A", query = "ILLUMINA_NEXTERA_transposase_A", strip_suffix = { query = "ILLUMINA_NEXTERA_core_motif", reverse_complement = true } },
  { name = "NEXTERA_B", query = "ILLUMINA_NEXTERA_transposase_B", strip_suffix = { query = "ILLUMINA_NEXTERA_core_motif", reverse_complement = true } },
]
census_catalogue = [
  { set = "ont_barcodes", source = "dorado_barcode_kits_v2.1.2.cpp", parser = "dorado_barcodes", label = "dorado", length = 24 },
  { set = "ont_barcodes", source = "ONT_chemistry.html", parser = "ont_native_table", label = "revAV" },
  { set = "ont_barcodes", source = "ONT_chemistry.html", parser = "ont_barcode_table", label = "revAV", name_pattern = "RB\\d{2}" },
  { set = "pacbio_barcodes", source = "Sequel_384_barcodes_v1_mirror_NIBIO.fasta", parser = "fasta", label = "sequel384v1" },
]
census_catalogue_checks = [
  { set = "ont_barcodes", family = "ont_rapid_barcode_context_90", segment = "barcode" },
  { set = "pacbio_barcodes", source = "Sequel_96_barcodes_v2.zip", parser = "fasta" },
]

[subset]
parents = 0
query_ids = []

[controls]
draws = 15
seed = 42
k = 2

[analysis_policy]
record_populations = ["all_records", "linear_genomic"]
minimum_query_length = { strict = 7, tolerant = 7 }
primary_window = 500
primary_minimum_length = 10000
windows = [100, 500, 1000]
minimum_lengths = [1000, 10000, 50000]

[database]
prefix = "${CORE_NT_DB}"
taxonomy_support = "${CORE_NT_TAXDB}"
download_evidence = "${CORE_NT_DOWNLOAD_EVIDENCE}"
hash_all = true
expected = { sequences = 130787235, bases = 1079005865156, volumes = 91, build_date = "2026-09-12" }
probes = [
  { accession_version = "KC332287.1", expected_length = 11379, allow_absent = false, basis = "NCBI ESummary length, retrieved 2026-09-15" },
  { accession_version = "XM_069202981.1", expected_length = 7281, allow_absent = false, basis = "NCBI ESummary length, retrieved 2026-09-15" },
  { accession_version = "HM753700.1", expected_length = 5386, allow_absent = false, basis = "NCBI ESummary length, retrieved 2026-09-15" },
  { accession_version = "OY737857.1", expected_length = 57931760, allow_absent = true, basis = "NCBI ESummary length, retrieved 2026-09-15" },
  { accession_version = "OV651819.1", expected_length = 83108335, allow_absent = true, basis = "NCBI ESummary length, retrieved 2026-09-15" },
]

[search]
threads = 60
batch_size = 16
target_limit = 2000
evalue = 10.0
threshold_mode = "fixed"
timeout_seconds = 3600
mode = "production"
informativeness_limit = 0.05
testable_chance_limit = 0.01
resume = true
scoring = { task = "blastn-short", word_size = 7, dust = "no", soft_masking = "false", strand = "both", reward = 1, penalty = -3, gapopen = 5, gapextend = 2 }

[ncbi]
email = "${NCBI_EMAIL}"

[metadata]
batch_size = 100
require_complete_retrieval = true

[taxonomy]
directory = "${TAXDUMP_DIR}"
source_url = "https://ftp.ncbi.nlm.nih.gov/pub/taxonomy/taxdump.tar.gz"
retrieved_utc = "2026-09-15T13:23:18.860940+00:00"
ranks = ["domain", "superkingdom", "genus"]

[insdc]
batch_size = 100
delay_seconds = 0.4
require_complete_retrieval = true

[positional]
diagnostic_window = 25

[record_cases]
version = "record_triage_v1"
matching_rule = "strict_single_ungapped_full_query"
category_order = ["terminal", "synthetic_or_vector", "internal_or_ambiguous"]
terminal_window = 500
terminal_minimum_length = 10000
flank_bases = 50
maximum_attempts_per_category = 3
maximum_selected_per_category = 1
sort_order = ["accession_version", "parent_id", "lower", "upper", "canonical_strand"]
no_repeated_selected_accession = true
internal_preferred_to_ambiguous = true
synthetic_title_declarations = ["cloning vector", "expression vector", "synthetic construct", "synthetic DNA"]
synthetic_rule = "Archived title explicitly declares a cloning or expression vector or a synthetic construct; taxon or context alone is insufficient"
incomplete_or_unidentified = "retained_in_candidate_register_not_eligible_for_verified_panel"
selection_basis = "Purposive deterministic triage illustrations of individual records"

[census]
flank = 50

[[census.families]]
name = "ont_native_barcode_24"
conditions = ["ont_barcode"]
orientation = "query"
required_flank = { upstream = 16, downstream = 16 }
classes = [
  { name = "K46", require = [{ side = "upstream", element = "K46_FRONT" }, { side = "downstream", element = "NATIVE_REAR" }] },
  { name = "K40_only", require = [{ side = "upstream", element = "K40_FRONT" }, { side = "downstream", element = "NATIVE_REAR" }] },
  { name = "rapid_context", require = [{ side = "upstream", element = "RAPID_FRONT" }, { side = "downstream", element = "RAPID_REAR_START" }] },
  { name = "native_front_only", require = [{ side = "upstream", element = "K40_FRONT" }] },
  { name = "native_rear_only", require = [{ side = "downstream", element = "NATIVE_REAR" }] },
]

[[census.families]]
name = "ont_rapid_rear_50"
query_ids = ["RAPID_adapter_forward"]
orientation = "query"
required_flank = { upstream = 40, downstream = 0 }
classes = [
  { name = "rapid_front_and_barcode", require = [{ side = "upstream", catalogue = "ont_barcodes", length = 24 }, { side = "upstream", element = "RAPID_FRONT", offset = 24 }] },
  { name = "catalogued_barcode_only", require = [{ side = "upstream", catalogue = "ont_barcodes", length = 24 }] },
  { name = "phage_mu_record", require = [{ taxon = 10677 }] },
]

[[census.families]]
name = "pacbio_smrtbell_45"
query_ids = ["SMRTbell_blunt_adapter_forward"]
orientation = "query"
required_flank = { upstream = 16, downstream = 16 }
classes = [
  { name = "barcode_adjacent", require = [{ side = "either", catalogue = "pacbio_barcodes", length = 16 }] },
]

[[census.families]]
name = "illumina_tn5_19"
query_ids = ["ILLUMINA_NEXTERA_core_motif"]
orientation = "reverse_complement"
note = "classified in the mosaic-end orientation"
required_flank = { upstream = 15, downstream = 0 }
classes = [
  { name = "nextera_A", require = [{ side = "upstream", element = "NEXTERA_A" }] },
  { name = "nextera_B", require = [{ side = "upstream", element = "NEXTERA_B" }] },
]

[exact_scan]
minimum_length = 23
workers = 16
volume_limit = 0
resume = true

[scan_validation]
require_acceptance = true

[target_limit]
arms = [500, 2000]

[benchmark]
source_archive = "${BLAST_SOURCE_TARBALL}"
extra_lengths = [19, 20, 21, 22, 23, 24, 25, 26, 29, 30, 31, 32, 40, 46, 90]
sizes = [
  { label = "core_nt", factor = 1.0 },
  { label = "core_nt_div10", factor = 0.1 },
  { label = "core_nt_x10", factor = 10.0 },
]
run_sizes = []
shard_limit = 0
workers = 4

[inference]
draw_ladder = [5, 10, 15]
retention_ladder = [500, 2000]
maximum_draws = 15
confidence = 0.95
detection_half_width = 0.01
breadth_absolute_half_width = 1.0
breadth_relative_half_width = 0.05
threads = 60
batch_size = 16
timeout_seconds = 3600

[validation]
require_production = true

[metrics]
chance_limit_variants = [
  { label = "stricter", testable_chance_limit = 0.001, informativeness_limit = 0.01 },
  { label = "looser", testable_chance_limit = 0.05, informativeness_limit = 0.10 },
]

[reports]
benchmark_arm = "permissive_diagnostic"
draw_prefixes = [5, 10, 15]

[figures]
scripts = "figures"
